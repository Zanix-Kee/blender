name: Publicar imagen
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/blenderfarm:latest
      # LTS: para maquinas con driver NVIDIA antiguo
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BLENDER_VERSION=4.5.16
          tags: ghcr.io/${{ github.repository_owner }}/blenderfarm:lts
